services:
  postgres:
    image: postgres:16-alpine
    container_name: nuevommo-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nuevommo
      POSTGRES_USER: nuevommo
      POSTGRES_PASSWORD: nuevommo_dev
    ports:
      - "5432:5432"
    volumes:
      - nuevommo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nuevommo -d nuevommo"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  nuevommo_postgres_data:
