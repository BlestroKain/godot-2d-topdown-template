name: Bump Version & Create Release

on:
  push:
    branches:
      - main

jobs:
  release:
    # Do not run if the commit was generated by our release bot
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump version in project.godot
        id: bump
        run: |
          python3 - << 'EOF'
          import re
          import os

          # Read project.godot
          with open("project.godot", "r", encoding="utf-8") as f:
              content = f.read()

          # Find current version
          match = re.search(r'config/version="(\d+)\.(\d+)\.(\d+)"', content)
          if not match:
              raise ValueError("Could not find config/version=\"X.Y.Z\" in project.godot")

          major, minor, patch = map(int, match.groups())

          # Check commit message for bump directives
          commit_msg = os.environ.get("COMMIT_MESSAGE", "").lower()

          if "[major]" in commit_msg:
              major += 1
              minor = 0
              patch = 0
          elif "[minor]" in commit_msg:
              minor += 1
              patch = 0
          else:
              patch += 1

          new_version = f"{major}.{minor}.{patch}"
          print(f"Bumping version from {match.group(0)} to {new_version}")

          # Replace in content
          new_content = content[:match.start()] + f'config/version="{new_version}"' + content[match.end():]
          with open("project.godot", "w", encoding="utf-8") as f:
              f.write(new_content)

          # Output for next steps
          with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
              out.write(f"version={new_version}\n")
              out.write(f"tag=v{new_version}\n")
          EOF
        env:
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}

      - name: Commit and push bumped version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project.godot
          git commit -m "chore(release): bump version to ${{ steps.bump.outputs.version }} [skip ci]"
          git push origin main

      - name: Create Git Tag
        run: |
          git tag -a "${{ steps.bump.outputs.tag }}" -m "Release ${{ steps.bump.outputs.tag }}"
          git push origin "${{ steps.bump.outputs.tag }}"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ steps.bump.outputs.tag }}" \
            --title "Release ${{ steps.bump.outputs.tag }}" \
            --generate-notes
