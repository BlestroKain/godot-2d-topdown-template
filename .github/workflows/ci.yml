name: CI

on:
  push:
    branches: [main, master, devMMO]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nuevommo
          POSTGRES_PASSWORD: nuevommo_ci
          POSTGRES_DB: nuevommo_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nuevommo -d nuevommo_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Reject lowercase core/ split
        run: |
          if git ls-files | grep -E '^core/'; then
            echo 'Git contains core/ (lowercase). All Core sources must live under Core/NuevoMMO.Core.'
            git ls-files | grep -E '^core/'
            exit 1
          fi
          test -f Core/NuevoMMO.Core/NuevoMMO.Core.csproj
          test -f Core/NuevoMMO.Core/Maps/MapAutotileResolver.cs

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Build solution
        timeout-minutes: 3
        run: dotnet build NuevoMMO.sln -c Release --nologo
        env:
          DOTNET_EnableWindowsTargeting: true

      - name: Run tests
        timeout-minutes: 3
        run: |
          timeout --foreground --signal=TERM --kill-after=10s 120s \
            dotnet run --project Tests/NuevoMMO.Tests/NuevoMMO.Tests.csproj -c Release --no-build --nologo
        env:
          NUEVOMMO_TEST_POSTGRES: Host=127.0.0.1;Port=5432;Database=nuevommo_test;Username=nuevommo;Password=nuevommo_ci;Pooling=false
